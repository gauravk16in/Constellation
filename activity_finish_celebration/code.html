<style>
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall 3s infinite linear;
        }
        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        
        .pulse-shadow {
            animation: pulse-shadow 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 0 0 rgba(120, 88, 245, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(120, 88, 245, 0); }
            100% { box-shadow: 0 0 0 0 rgba(120, 88, 245, 0); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0px 12px 32px rgba(124, 93, 250, 0.08);

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Confetti Container -->
<div class="absolute inset-0 pointer-events-none z-0" id="confetti-container"></div>
<!-- Main Content Container -->
<main class="w-full max-w-md mx-auto px-margin-mobile flex flex-col items-center justify-center relative z-10 space-y-section-gap pt-12 pb-24">
<!-- Top App Bar (Suppressed per "Bottom Navigation: None (focused flow)", but keeping a clean header area if needed, omitted here to focus on the content canvas as instructed) -->

<p class="font-body-lg text-body-lg text-on-surface-variant">Great job keeping track.</p>

<!-- Illustration / Badge -->

<!-- Action Prompt -->

<div class="flex flex-col w-full gap-stack-gap">
<!-- Option 1: Show -->

<script>
        // Simple Confetti Generator
        function createConfetti() {
            const colors = ['#7858f5', '#cabeff', '#007f9c', '#fd7c72', '#b7eaff'];
            const container = document.getElementById('confetti-container');
            const numConfetti = 50;

            for (let i = 0; i < numConfetti; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Random properties
                const left = Math.random() * 100;
                const animDuration = Math.random() * 3 + 2;
                const animDelay = Math.random() * 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const size = Math.random() * 8 + 4;

                confetti.style.left = `${left}%`;
                confetti.style.top = '-20px';
                confetti.style.backgroundColor = color;
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size * (Math.random() > 0.5 ? 2 : 1)}px`;
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.animationDuration = `${animDuration}s`;
                confetti.style.animationDelay = `${animDelay}s`;

                container.appendChild(confetti);
            }
        }

        // Run confetti on load
        window.addEventListener('DOMContentLoaded', createConfetti);
    </script>
</body></html>
