</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-2 mr-2">

<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full h-14 bg-surface-container rounded-lg px-4 border-none focus:ring-2 focus:ring-primary/50 font-body-md text-on-surface placeholder:text-outline/50 transition-shadow" id="password" placeholder="••••••••" type="password">
