<p class="font-body-md text-body-md text-on-surface-variant">Create an account to start your child's stress-free journey.</p>
</div>
<!-- Sign Up Form -->
<form class="w-full space-y-stack-gap">
<!-- Full Name -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant pl-4" for="fullName">Full Name</label>
<input class="w-full h-14 bg-surface-container-highest/50 rounded-lg px-4 border border-outline-variant/30 focus:ring-2 focus:ring-primary/50 font-body-md text-on-surface placeholder:text-outline/50 transition-shadow" id="fullName" placeholder="Jane Doe" type="text">
</div>
<!-- Email -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant pl-4" for="email">Email Address</label>
<input class="w-full h-14 bg-surface-container-highest/50 rounded-lg px-4 border border-outline-variant/30 focus:ring-2 focus:ring-primary/50 font-body-md text-on-surface placeholder:text-outline/50 transition-shadow" id="email" placeholder="jane@example.com" type="email">
</div>
<!-- Password -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant pl-4" for="password">Password</label>
<input class="w-full h-14 bg-surface-container-highest/50 rounded-lg px-4 border border-outline-variant/30 focus:ring-2 focus:ring-primary/50 font-body-md text-on-surface placeholder:text-outline/50 transition-shadow" id="password" placeholder="••••••••" type="password">
</div>
<!-- CTA -->
<button class="w-full h-14 mt-4 bg-primary text-on-primary rounded-full font-label-md text-label-md shadow-[0px_8px_16px_rgba(124,93,250,0.2)] hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center" type="button">
                    Create Account

<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-outline">OR</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Social Sign Up -->
